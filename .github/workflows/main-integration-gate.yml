name: Main integration gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  main-integration-gate:
    name: main-integration-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Runtime
        run: |
          python - <<'PY'
          import sqlite3, sys
          print(sys.version)
          print(sqlite3.sqlite_version)
          PY

      - name: Install
        run: python -m pip install -e '.[dev]' --disable-pip-version-check

      - name: Compile
        run: python -m compileall -q src scripts

      - name: Audit durable authority boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path(".github/workflows/durable-runtime-control.yml").read_text()
          authority = Path(".github/workflows/durable-human-authority.yml").read_text()

          assert "runtime/durable-asp-control" in runtime
          assert "runtime/durable-asp-control" in authority
          assert '"events/*.json"' in runtime
          assert '"authority/*.json"' in authority
          assert '"authority/*.json"' not in runtime
          assert '"events/*.json"' not in authority
          assert 'test "$GITHUB_ACTOR" = "Waterfound"' in runtime
          assert 'test "$GITHUB_ACTOR" = "Waterfound"' in authority
          assert "group: durable-asp-persistent-runtime" in runtime
          assert "group: durable-asp-persistent-runtime" in authority
          assert "cancel-in-progress: false" in runtime
          assert "cancel-in-progress: false" in authority
          assert "authority_created" in runtime
          assert "authority_created" in authority

          for text, variable in (
              (runtime, "PERSISTENT_RUNTIME_REVISION"),
              (authority, "HUMAN_AUTHORITY_RUNTIME_REVISION"),
          ):
              match = re.search(rf"{variable}: ([0-9a-f]{{40}})", text)
              assert match, f"missing immutable 40-hex pin for {variable}"

          for text in (runtime, authority):
              lowered = text.lower()
              assert "production" not in lowered
              assert "release" not in lowered
              assert "branches:\n      - main" not in text
          PY

      - name: Full regression
        run: python -m pytest -q

      - name: Git whitespace check
        run: git diff --check HEAD^ HEAD || true
