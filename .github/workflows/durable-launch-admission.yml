name: Durable execution launch admission

on:
  push:
    branches:
      - runtime/durable-asp-control
    paths:
      - "launch-orders/*.json"
      - "constitutional-assessments/*.json"

permissions:
  contents: write

concurrency:
  group: durable-asp-persistent-runtime
  cancel-in-progress: false

env:
  RUNTIME_BRANCH: runtime/durable-asp-control
  LAUNCH_ADMISSION_REVISION: c87d3bb64259840a3f7b4354107a3f6b3cbc0eb7

jobs:
  admit-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Enforce launch host boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$RUNTIME_BRANCH"
          case "$GITHUB_ACTOR" in
            Waterfound|github-actions\[bot\]) ;;
            *) echo "unauthorized launch-order actor: $GITHUB_ACTOR" >&2; exit 1 ;;
          esac

      - name: Checkout immutable launch-order trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Admit exactly one immutable launch order plus constitutional assessment
        id: order
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA" -- 'launch-orders/*.json' 'constitutional-assessments/*.json' > /tmp/constitutional-launch-changes.txt
          python - <<'PY'
          import json, os, pathlib, re
          rows=[line.strip().split("\t",1) for line in pathlib.Path("/tmp/constitutional-launch-changes.txt").read_text().splitlines() if line.strip()]
          assert len(rows)==2, f"expected one launch order and one constitutional assessment, got {rows}"
          by_kind={}
          for status,path in rows:
              assert status=="A", f"constitutional launch artifacts must be immutable create-only, got {status}:{path}"
              if path.startswith("launch-orders/") and path.endswith(".json"):
                  kind="order"
              elif path.startswith("constitutional-assessments/") and path.endswith(".json"):
                  kind="assessment"
              else:
                  raise AssertionError(f"unexpected constitutional launch artifact: {path}")
              assert kind not in by_kind, f"duplicate {kind} artifact"
              by_kind[kind]=path
          assert set(by_kind)=={"order","assessment"}, by_kind

          order=json.loads(pathlib.Path(by_kind["order"]).read_text())
          assessment=json.loads(pathlib.Path(by_kind["assessment"]).read_text())
          workstream=order.get("workstream_id")
          assert isinstance(workstream,str) and re.fullmatch(r"[A-Za-z0-9._:-]{1,160}",workstream)
          assert assessment.get("workstream_id")==workstream, "constitutional assessment workstream mismatch"
          if os.environ["GITHUB_ACTOR"]=="github-actions[bot]":
              assert order.get("required_authority_scopes")==[], "bot launch orders may not consume authority in ELG-01 v1"
              assert order.get("authority") is None, "bot launch orders may not carry authority in ELG-01 v1"

          pathlib.Path("/tmp/launch-order.json").write_bytes(pathlib.Path(by_kind["order"]).read_bytes())
          pathlib.Path("/tmp/constitutional-assessment.json").write_bytes(pathlib.Path(by_kind["assessment"]).read_bytes())
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"path={by_kind['order']}\n")
              out.write(f"assessment_path={by_kind['assessment']}\n")
              out.write(f"workstream={workstream}\n")
          PY

      - name: Reject credential-shaped launch data
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          forbidden=("secret","password","token","credential","private_key","private-key","api_key","api-key")
          def walk(value,path="$"):
              if isinstance(value,dict):
                  for key,child in value.items():
                      low=key.lower()
                      assert not any(term in low for term in forbidden), f"credential-shaped key forbidden: {path}.{key}"
                      walk(child,f"{path}.{key}")
              elif isinstance(value,list):
                  for index,child in enumerate(value):
                      walk(child,f"{path}[{index}]")
          for filename in ("/tmp/launch-order.json","/tmp/constitutional-assessment.json"):
              walk(json.loads(pathlib.Path(filename).read_text()), filename)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare pinned verified launch-admission source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$LAUNCH_ADMISSION_REVISION^{commit}"
          git worktree add --detach /tmp/launch-src "$LAUNCH_ADMISSION_REVISION"
          cd /tmp/launch-src
          python -m pip install -e '.[dev]' --disable-pip-version-check
          python -m compileall -q src scripts
          python -m pytest tests/test_execution_launch_admission.py tests/test_canonical_constitution.py tests/test_constitutional_launch_host.py -q

      - name: Authenticate order and derive durable identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          digest="$(PYTHONPATH=/tmp/launch-src/src python /tmp/launch-src/scripts/run_constitutional_launch_admission.py --order /tmp/launch-order.json --print-order-digest)"
          python - "$digest" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          order=json.loads(Path("/tmp/launch-order.json").read_text())
          assessment=json.loads(Path("/tmp/constitutional-assessment.json").read_text())
          digest=sys.argv[1]
          assert assessment.get("subject_digest")==digest, "constitutional assessment does not bind exact order digest"
          key=hashlib.sha256(order["workstream_id"].encode()).hexdigest()[:24]
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"order_digest={digest}\n")
              out.write(f"workstream_key={key}\n")
          PY

      - name: Move to latest serialized runtime head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RUNTIME_BRANCH"
          git rev-parse "origin/$RUNTIME_BRANCH" > /tmp/runtime-start.txt
          git checkout -B "$RUNTIME_BRANCH" "origin/$RUNTIME_BRANCH"

      - name: Recover prior receipt if this workstream already exists
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          marker="runtime/launch-admission/workstreams/${{ steps.identity.outputs.workstream_key }}.json"
          if test -f "$marker"; then
            receipt_path="$(python - "$marker" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))["receipt_path"])
          PY
            )"
            test -f "$receipt_path"
            cp "$receipt_path" /tmp/existing-launch-receipt.json
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize deterministic constitutional and launch receipts
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --order /tmp/launch-order.json
            --constitutional-assessment /tmp/constitutional-assessment.json
            --authenticated-actor "$GITHUB_ACTOR"
            --authenticated-order-digest "${{ steps.identity.outputs.order_digest }}"
            --constitutional-receipt-out /tmp/constitutional-receipt.json
            --launch-receipt-out /tmp/launch-receipt.json
            --result-out /tmp/launch-result.json
          )
          if test "${{ steps.replay.outputs.existing }}" = "true"; then
            args+=(--existing-launch-receipt /tmp/existing-launch-receipt.json)
          fi
          PYTHONPATH=/tmp/launch-src/src python /tmp/launch-src/scripts/run_constitutional_launch_admission.py "${args[@]}"
          cat /tmp/constitutional-receipt.json
          cat /tmp/launch-result.json

      - name: Persist constitutional evidence and admitted launch binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/constitutional-admission/{receipts,results} runtime/launch-admission/{receipts,workstreams}
          python - "${{ steps.identity.outputs.workstream_key }}" <<'PY'
          import json,pathlib,sys
          order=json.loads(pathlib.Path("/tmp/launch-order.json").read_text())
          constitutional=json.loads(pathlib.Path("/tmp/constitutional-receipt.json").read_text())
          result=json.loads(pathlib.Path("/tmp/launch-result.json").read_text())
          key=sys.argv[1]

          constitutional_path=f"runtime/constitutional-admission/receipts/{constitutional['receipt_id']}.json"
          result_path=f"runtime/constitutional-admission/results/{result['order_id']}.json"
          pathlib.Path(constitutional_path).write_text(json.dumps(constitutional,sort_keys=True,indent=2)+"\n")
          pathlib.Path(result_path).write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")

          launch_path=pathlib.Path("/tmp/launch-receipt.json")
          if not launch_path.exists():
              assert result["constitutional_gate_passed"] is False
              assert result["launch_admission_materialized"] is False
              raise SystemExit(0)

          receipt=json.loads(launch_path.read_text())
          receipt_path=f"runtime/launch-admission/receipts/{receipt['receipt_id']}.json"
          marker_path=f"runtime/launch-admission/workstreams/{key}.json"
          pathlib.Path(receipt_path).write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          marker={
              "schema_version":"ge.constitutionally-governed-workstream-binding.v1",
              "workstream_id":order["workstream_id"],
              "order_id":receipt["order_id"],
              "order_digest":receipt["order_digest"],
              "constitutional_receipt_id":constitutional["receipt_id"],
              "constitutional_receipt_path":constitutional_path,
              "constitutional_disposition":constitutional["constitutional_disposition"],
              "constitutional_gate_passed":constitutional["constitutional_gate_passed"],
              "receipt_id":receipt["receipt_id"],
              "receipt_path":receipt_path,
              "disposition":receipt["disposition"],
              "launch_id":receipt["launch_id"],
              "dispatch_identity":receipt["dispatch_identity"],
              "authority_created":False,
              "execution_triggered":False,
          }
          existing=pathlib.Path(marker_path)
          if existing.exists():
              prior=json.loads(existing.read_text())
              assert prior==marker, "workstream binding changed on replay"
          else:
              existing.write_text(json.dumps(marker,sort_keys=True,indent=2)+"\n")
          PY

      - name: Commit only receipt evidence with runtime-head CAS
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RUNTIME_BRANCH"
          test "$(git rev-parse "origin/$RUNTIME_BRANCH")" = "$(cat /tmp/runtime-start.txt)"
          git config user.name "durable-launch-admission"
          git config user.email "durable-launch-admission@users.noreply.github.com"
          git add runtime/constitutional-admission/ runtime/launch-admission/
          git diff --cached --quiet && exit 0
          git commit -m "runtime: admit execution launch ${{ steps.order.outputs.workstream }} [skip ci]"
          git push origin "HEAD:refs/heads/$RUNTIME_BRANCH"

      - name: Upload launch admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-launch-admission-${{ github.run_id }}
          path: |
            /tmp/launch-order.json
            /tmp/constitutional-assessment.json
            /tmp/constitutional-receipt.json
            /tmp/launch-receipt.json
            /tmp/launch-result.json
          if-no-files-found: warn
          retention-days: 30
