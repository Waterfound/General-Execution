name: Candidate public/private egress assurance
on:
  pull_request:
  push:
    branches:
      - security/egress-boundary-candidate-20261010

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Negative public/private boundary regression
        run: python -m pytest -q tests/test_publication_boundary.py
      - name: Verify candidate changed files do not publish private state
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -n "$BASE_COMMIT"
          test -n "$HEAD_COMMIT"
          python tools/audit_public_egress.py --base "$BASE_COMMIT" --head "$HEAD_COMMIT"
