name: Bounded unattended pilot live

on:
  push:
    branches:
      - feature/durable-asp-portfolio-state
    paths:
      - pilots/live-activation-2026-09-27.json

permissions:
  contents: read

concurrency:
  group: durable-asp-live-pilot-2026-09-27
  cancel-in-progress: false

jobs:
  bounded-live-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PILOT_TESTED_REVISION: 1827175ba7b926dfabaeca57791f83595ece11e0
      PILOT_ACTIVATION_ID: durable-asp-live-pilot-2026-09-27-001
    steps:
      - name: Checkout activation commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify bounded activation manifest
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("pilots/live-activation-2026-09-27.json")
          data = json.loads(path.read_text())
          required = {
              "schema_version": "ge.unattended-pilot-live-activation.v1",
              "activation_id": os.environ["PILOT_ACTIVATION_ID"],
              "authorized": True,
              "scope": "one-bounded-real-provider-triggered-pilot",
              "provider": "github_actions",
              "branch": "feature/durable-asp-portfolio-state",
              "tested_revision": os.environ["PILOT_TESTED_REVISION"],
              "allow_main": False,
              "allow_merge": False,
              "allow_release": False,
              "allow_production": False,
              "allow_new_spend": False,
              "must_stop_at_human_gate": True,
          }
          for key, value in required.items():
              assert data.get(key) == value, (key, data.get(key), value)
          pathlib.Path("/tmp/live-activation.json").write_text(
              json.dumps(data, sort_keys=True, indent=2) + "\n"
          )
          PY

      - name: Checkout exact validated pilot source
        run: |
          git fetch --depth=1 origin "$PILOT_TESTED_REVISION"
          git checkout --detach "$PILOT_TESTED_REVISION"
          test "$(git rev-parse HEAD)" = "$PILOT_TESTED_REVISION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Runtime
        run: |
          python - <<'PY'
          import sys, sqlite3
          print(sys.version)
          print(sqlite3.sqlite_version)
          PY

      - name: Install
        run: python -m pip install -e '.[dev]' --disable-pip-version-check

      - name: Compile
        run: python -m compileall -q src scripts

      - name: Execute real provider-triggered bounded pilot
        run: |
          mkdir -p live-evidence
          python scripts/run_unattended_pilot.py --output live-evidence/pilot

      - name: Bind provider trigger to pilot evidence
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          activation = json.loads(pathlib.Path("/tmp/live-activation.json").read_text())
          pilot = json.loads(pathlib.Path("live-evidence/pilot/pilot-preflight-report.json").read_text())
          assert pilot["status"] == "PASS_NOT_ACTIVATED"
          assert pilot["process_invocations"] == 8
          assert pilot["state_transitions"] == 5
          assert pilot["final_state"] == "human_gate"
          assert pilot["authority_stop"] is True
          assert pilot["human_required"] is True
          assert pilot["chat_context_required"] is False
          assert pilot["provider_trigger_enabled"] is False
          assert pilot["unattended_runtime_enabled"] is False

          report = {
              "schema_version": "ge.unattended-pilot-live-report.v1",
              "status": "PASS_STOPPED_AT_HUMAN_GATE",
              "activation_id": activation["activation_id"],
              "activation_scope": activation["scope"],
              "provider": "github_actions",
              "provider_event": os.environ["GITHUB_EVENT_NAME"],
              "provider_run_id": os.environ["GITHUB_RUN_ID"],
              "provider_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "provider_actor": os.environ["GITHUB_ACTOR"],
              "trigger_commit": os.environ["GITHUB_SHA"],
              "trigger_ref": os.environ["GITHUB_REF"],
              "tested_revision": os.environ["PILOT_TESTED_REVISION"],
              "process_invocations": pilot["process_invocations"],
              "state_transitions": pilot["state_transitions"],
              "final_generation": pilot["final_generation"],
              "final_state": pilot["final_state"],
              "authority_stop": pilot["authority_stop"],
              "human_required": pilot["human_required"],
              "chat_context_required": pilot["chat_context_required"],
              "real_provider_trigger_observed": True,
              "bounded_unattended_execution_observed": True,
              "persistent_provider_trigger_enabled": False,
              "persistent_unattended_runtime_enabled": False,
              "main_modified": False,
              "merge_performed": False,
              "release_performed": False,
              "production_modified": False,
              "new_spend_authorized": False,
          }
          payload = json.dumps(report, sort_keys=True, separators=(",", ":")).encode()
          report["report_digest"] = "sha256:" + hashlib.sha256(payload).hexdigest()
          pathlib.Path("live-evidence/live-provider-pilot-report.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Full regression after live pilot
        run: python -m pytest -q

      - name: Upload canonical pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: durable-asp-live-pilot-2026-09-27-001
          path: live-evidence/
          if-no-files-found: error
          retention-days: 30
