name: PBR-001 Portfolio Backup Contract
on:
  push:
    branches: [colony/portfolio-backup-resilience-001]
  pull_request:
    paths:
      - 'src/general_execution/portfolio_backup.py'
      - 'tests/test_portfolio_backup.py'
      - 'examples/portfolio-backup-manifest.json'
      - 'docs/PORTFOLIO_BACKUP_RESILIENCE.md'
      - '.github/workflows/portfolio-backup-contract.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_portfolio_backup.py
