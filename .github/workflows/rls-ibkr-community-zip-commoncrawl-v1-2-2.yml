name: RLS IBKR Community ZIP Common Crawl V1.2.2

on:
  push:
    branches:
      - build-colony/rls-ibkr-archive-recovery-v1
    paths:
      - workloads/rls_ibkr_community_zip_commoncrawl_v1_2_2.py
      - .github/workflows/rls-ibkr-community-zip-commoncrawl-v1-2-2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-commoncrawl-zip-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4

      - name: Record exact revision
        run: |
          git rev-parse HEAD
          python3 --version

      - name: Execute Common Crawl metadata discovery V1.2.2
        working-directory: workloads
        run: python3 rls_ibkr_community_zip_commoncrawl_v1_2_2.py

      - name: Verify metadata-only invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('workloads/artifacts/rls_ibkr_community_zip_commoncrawl_v1_2_2.json')
          d = json.loads(p.read_text())
          assert d['authority'] == 'OBSERVATION_ONLY_NO_RLS_ADMISSION_AUTHORITY'
          assert d['credential_policy']['user_specific_credentials_used'] is False
          assert d['credential_policy']['api_key_used'] is False
          assert d['credential_policy']['aws_login_used'] is False
          assert d['frozen_query']['selection_stage'] == 'METADATA_ONLY'
          assert d['archived_warc_or_zip_bytes_opened'] is False
          assert d['admission_authority_granted'] is False
          print('worker_version=', d['worker_version'])
          print('evidence_digest_sha256=', d['evidence_digest_sha256'])
          print('collection_count=', d['collection_count'])
          print('query_statuses=', [(q['crawl_id'], q['status'], q['http_status'], q['match_count'], q['error']) for q in d['queries']])
          print('raw_match_count=', d['raw_match_count'])
          print('distinct_digest_count=', d['distinct_digest_count'])
          print('distinct_digests_in_selection_order=', d['distinct_digests_in_selection_order'])
          PY

      - name: Upload metadata manifest
        uses: actions/upload-artifact@v4
        with:
          name: rls-ibkr-community-zip-commoncrawl-v1-2-2
          path: workloads/artifacts/rls_ibkr_community_zip_commoncrawl_v1_2_2.json
          if-no-files-found: error
          retention-days: 30
