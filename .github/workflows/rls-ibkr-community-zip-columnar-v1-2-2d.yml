name: RLS IBKR Community ZIP Columnar Transport V1.2.2d

on:
  push:
    branches:
      - build-colony/rls-ibkr-archive-recovery-v1
    paths:
      - workloads/rls_ibkr_community_zip_columnar_transport_v1_2_2d.py
      - .github/workflows/rls-ibkr-community-zip-columnar-v1-2-2d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-unsigned-columnar-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Record exact revision and AWS CLI availability
        run: |
          git rev-parse HEAD
          python3 --version
          aws --version

      - name: Install pinned DuckDB transport engine
        run: python3 -m pip install --disable-pip-version-check 'duckdb==1.4.0'

      - name: Execute unsigned shard listing and fixed HTTPS Parquet query
        working-directory: workloads
        run: python3 rls_ibkr_community_zip_columnar_transport_v1_2_2d.py

      - name: Verify zero-credential and authority boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('workloads/artifacts/rls_ibkr_community_zip_columnar_transport_v1_2_2d.json').read_text())
          assert d['authority']=='OBSERVATION_ONLY_NO_RLS_ADMISSION_AUTHORITY'
          assert d['phase']=='A_TRANSPORT_FEASIBILITY_ONLY'
          assert d['frozen_crawl_id']=='CC-MAIN-2021-17'
          assert d['frozen_target']['url_host_registered_domain']=='potential-investments.com'
          assert d['frozen_target']['url_path']=='/ib_shorting.zip'
          assert d['frozen_target']['fetch_status']==200
          assert all(v is False for v in d['credential_policy'].values())
          assert all(v is False for v in d['boundaries'].values())
          assert d['result']['zero_rows_if_any_do_not_prove_absence'] is True
          assert d['result']['admission_authority_granted'] is False
          print('listing_status=',d['listing'].get('status'))
          print('listing_error=',d['listing'].get('error'))
          print('listing_exit_code=',d['listing'].get('exit_code'))
          print('parquet_shard_count=',d['listing'].get('parquet_shard_count'))
          print('shards_sha256=',d['listing'].get('shards_sha256'))
          print('query_status=',d['query'].get('status'))
          print('row_count=',d['query'].get('row_count'))
          print('rows_sha256=',d['query'].get('rows_sha256'))
          print('query_error=',d['query'].get('error'))
          print('transport_success=',d['result']['transport_success'])
          print('phase_b_authorized_by_transport_gate=',d['result']['phase_b_authorized_by_transport_gate'])
          print('evidence_digest_sha256=',d['evidence_digest_sha256'])
          PY

      - name: Upload transport evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: rls-ibkr-community-zip-columnar-v1-2-2d
          path: workloads/artifacts/rls_ibkr_community_zip_columnar_transport_v1_2_2d.json
          if-no-files-found: error
          retention-days: 30
