name: EAC-01 Build Colony transport probe

on:
  push:
    branches:
      - "build-colony/eac01-receipt-bound-executor-activation-001"
    paths:
      - ".github/workflows/eac01-build-colony-transport-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe current repository-scoped token against private Build Colony
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/build-colony-probe.json -w '%{http_code}'             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             https://api.github.com/repos/Waterfound/Build-Colony)"
          case "$code" in
            200)
              echo "EAC01_CROSS_REPO_TRANSPORT=AVAILABLE"
              ;;
            403|404)
              echo "EAC01_CROSS_REPO_TRANSPORT=UNAVAILABLE_WITH_CURRENT_GITHUB_TOKEN"
              ;;
            *)
              echo "unexpected HTTP status: $code" >&2
              exit 1
              ;;
          esac
