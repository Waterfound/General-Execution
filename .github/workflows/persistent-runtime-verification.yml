name: Persistent runtime verification

on:
  push:
    branches:
      - feature/durable-asp-portfolio-state
    paths:
      - src/general_execution/persistent_runtime.py
      - scripts/run_persistent_runtime_event.py
      - tests/test_persistent_runtime.py
      - .github/workflows/durable-runtime-control.yml
      - .github/workflows/persistent-runtime-verification.yml

permissions:
  contents: read

jobs:
  verify-persistent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Runtime
        run: |
          python - <<'PY'
          import sys, sqlite3
          print(sys.version)
          print(sqlite3.sqlite_version)
          PY
      - name: Install
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Persistent runtime focused tests
        run: python -m pytest tests/test_persistent_runtime.py -q
      - name: Audit persistent workflow envelope
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path(".github/workflows/durable-runtime-control.yml").read_text()
          required=[
              "runtime/durable-asp-control",
              '"events/*.json"',
              "contents: write",
              'test "$GITHUB_ACTOR" = "Waterfound"',
              "cancel-in-progress: false",
              "persistent_provider_trigger_enabled",
              "authority_created",
          ]
          for item in required:
              assert item in text, item
          assert "branches:\n      - main" not in text
          assert "production" not in text.lower()
          assert "release" not in text.lower()
          PY
      - name: Full regression
        run: python -m pytest -q
