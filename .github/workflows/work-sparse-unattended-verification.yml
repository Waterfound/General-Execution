name: Work-sparse unattended verification

on:
  push:
    branches:
      - build-colony/work-sparse-unattended-001
    paths:
      - src/general_execution/work_sparse_unattended.py
      - scripts/run_work_sparse_controller.py
      - tests/test_work_sparse_unattended.py
      - docs/work-sparse-unattended-execution.md
      - examples/work-sparse/**
      - .github/workflows/work-sparse-unattended-verification.yml
  pull_request:
    paths:
      - src/general_execution/work_sparse_unattended.py
      - scripts/run_work_sparse_controller.py
      - tests/test_work_sparse_unattended.py
      - docs/work-sparse-unattended-execution.md
      - examples/work-sparse/**
      - .github/workflows/work-sparse-unattended-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and compile
        run: |
          python -m pip install -e '.[dev]' --disable-pip-version-check
          python -m compileall -q src scripts

      - name: Focused work-sparse adversarial bank
        run: python -m pytest tests/test_work_sparse_unattended.py -q

      - name: Prove non-Work default route
        run: |
          python scripts/run_work_sparse_controller.py             --envelope examples/work-sparse/authority-envelope.json             --work-item examples/work-sparse/repo-ci-work.json             --executors examples/work-sparse/executors.json             --output /tmp/repo-ci-route.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/repo-ci-route.json'))
          assert d['disposition']=='DISPATCH', d
          assert d['selected_executor_id']=='github_actions', d
          assert d['work_required'] is False, d
          assert d['authority_created'] is False, d
          assert d['execution_triggered'] is False, d
          PY

      - name: Prove Work budget zero fails closed
        run: |
          python scripts/run_work_sparse_controller.py             --envelope examples/work-sparse/authority-envelope.json             --work-item examples/work-sparse/browser-work.json             --executors examples/work-sparse/executors.json             --output /tmp/browser-route.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/browser-route.json'))
          assert d['disposition']=='CONDITION_WAIT', d
          assert d['selected_executor_id'] is None, d
          assert d['authority_created'] is False, d
          assert d['execution_triggered'] is False, d
          assert any('work_budget_exhausted' in x for x in d['reasons']), d
          PY

      - name: Full General Execution regression
        run: python -m pytest -q

      - name: Audit authority and scarce-Work boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          module=Path('src/general_execution/work_sparse_unattended.py').read_text()
          docs=Path('docs/work-sparse-unattended-execution.md').read_text()
          fixture=Path('examples/work-sparse/authority-envelope.json').read_text()
          required=[
              'authority_created: bool = False',
              'execution_triggered: bool = False',
              'max_work_invocations',
              'max_paid_spend_cents',
              'OBSERVE_EXISTING',
              'CONDITION_WAIT',
              'HUMAN_GATE',
              '1 if executor.requires_work else 0',
          ]
          for item in required:
              assert item in module, item
          assert 'Work a scarce capability executor' in docs
          assert '"max_work_invocations": 0' in fixture
          assert '"max_paid_spend_cents": 0' in fixture
          PY
