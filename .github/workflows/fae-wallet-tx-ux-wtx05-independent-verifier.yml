name: FAE Wallet UX WTX05 independent verifier

on:
  push:
    branches:
      - feature/durable-asp-portfolio-state
    paths:
      - .github/workflows/fae-wallet-tx-ux-wtx05-independent-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FAE_BASE: 8f478e374a92d61d79aedc0cc816b0525a6c03dd
  FAE_CANDIDATE: d36c2302cbdcce1fa7b38896362bd58b0a24dd00

jobs:
  project-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Waterfound/FAE-testnet
          ref: d36c2302cbdcce1fa7b38896362bd58b0a24dd00
          fetch-depth: 1
          path: fae
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify immutable WTX05 test-only delta
        working-directory: fae
        run: |
          test "$(git rev-parse HEAD)" = "$FAE_CANDIDATE"
          git fetch --depth=1 origin "$FAE_BASE"
          python - <<'PY'
          import os, subprocess
          expected={
            ".github/workflows/wallet-tx-ux-browser.yml",
            ".github/workflows/wallet-tx-ux-current-main.yml",
            "tests/wallet-browser-validation.spec.mjs",
          }
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",os.environ["FAE_BASE"],os.environ["FAE_CANDIDATE"]],
              text=True,
          ).splitlines())
          assert changed==expected,(sorted(changed),sorted(expected))
          forbidden=(
            "core.js","index.html","wallet.js","wallet-crypto.js",
            "wallet-transactions.js","mining.js","network-status.js"
          )
          assert not any(path in changed for path in forbidden)
          assert not any(path.startswith(("supabase/","sovereign-forge/")) for path in changed)
          PY

      - name: Re-run deterministic Wallet UX gates
        working-directory: fae
        run: |
          node --check core.js
          node --check wallet.js
          node --check wallet-transactions.js
          node tests/wallet-transactions-contract.mjs
          node tests/wallet-transactions-acceptance.mjs
          node tests/wallet-history-lifecycle.mjs
          node tests/crypto-compat.mjs
          node tests/client-smoke.mjs
          npm ci --prefix sovereign-forge/node
          npm run --prefix sovereign-forge/node check
          node sovereign-forge/tests/smoke-independent-node.mjs

      - name: Install pinned Chromium verifier
        working-directory: fae
        run: |
          printf '{"private":true}\n' > package.json
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated local client
        working-directory: fae
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wtx05-pa-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wtx05-pa-http.log
          exit 1

      - name: Independently repeat real-browser journeys
        working-directory: fae
        run: npx playwright test tests/wallet-browser-validation.spec.mjs --reporter=line --workers=1
