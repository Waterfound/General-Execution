name: State boundary verification

on:
  push:
    branches:
      - feature/state-boundary-v1
  pull_request:
    paths:
      - "src/general_execution/state_boundary.py"
      - "src/general_execution/state_plane_host.py"
      - "tests/test_state_boundary.py"
      - "tests/test_state_boundary_preservation_integration.py"
      - "tests/test_state_plane_host.py"
      - "docs/state-boundary.md"
      - ".github/workflows/state-boundary-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install candidate
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Compile
        run: python -m compileall -q src tests
      - name: Focused preservation proof
        run: python -m pytest -q tests/test_state_boundary.py tests/test_state_boundary_preservation_integration.py tests/test_state_plane_host.py
      - name: Full regression
        run: python -m pytest -q
      - name: Fetch current durable snapshot without changing checkout
        run: |
          git fetch --no-tags origin runtime/durable-asp-control:refs/remotes/origin/runtime/durable-asp-control
          git show refs/remotes/origin/runtime/durable-asp-control:runtime/state.sqlite.b64 > "$RUNNER_TEMP/state.sqlite.b64"
          git show refs/remotes/origin/runtime/durable-asp-control:runtime/manifest.json > "$RUNNER_TEMP/manifest.json"
      - name: Verify live durable snapshot recovery
        run: |
          python tools/verify_durable_snapshot.py \
            --state-b64 "$RUNNER_TEMP/state.sqlite.b64" \
            --manifest "$RUNNER_TEMP/manifest.json"
      - name: Verify shadow transport form recovery
        run: |
          cp "$RUNNER_TEMP/state.sqlite.b64" "$RUNNER_TEMP/state-shadow.sqlite.b64"
          printf '\n' >> "$RUNNER_TEMP/state-shadow.sqlite.b64"
          python tools/verify_durable_snapshot.py \
            --state-b64 "$RUNNER_TEMP/state-shadow.sqlite.b64" \
            --manifest "$RUNNER_TEMP/manifest.json"
