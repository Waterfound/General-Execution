name: Work escalation bridge verification

on:
  push:
    branches:
      - build-colony/work-escalation-bridge-001
    paths:
      - src/general_execution/work_escalation_bridge.py
      - src/general_execution/__init__.py
      - tests/test_work_escalation_bridge.py
      - docs/work-escalation-bridge.md
      - scripts/run_work_escalation_bridge_rehearsal.py
      - evidence/durable-execution/2026-10-06/work-escalation-bridge-candidate.json
      - .github/workflows/work-escalation-bridge-verification.yml
  pull_request:
    paths:
      - src/general_execution/work_escalation_bridge.py
      - src/general_execution/__init__.py
      - tests/test_work_escalation_bridge.py
      - docs/work-escalation-bridge.md
      - scripts/run_work_escalation_bridge_rehearsal.py
      - evidence/durable-execution/2026-10-06/work-escalation-bridge-candidate.json
      - .github/workflows/work-escalation-bridge-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and compile
        run: |
          python -m pip install -e '.[dev]' --disable-pip-version-check
          python -m compileall -q src scripts

      - name: Focused Work escalation adversarial bank
        run: python -m pytest tests/test_work_escalation_bridge.py -q

      - name: Run restart-safe Work escalation rehearsal
        run: |
          python scripts/run_work_escalation_bridge_rehearsal.py --output /tmp/work-escalation-rehearsal
          cat /tmp/work-escalation-rehearsal/report.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/work-escalation-rehearsal/report.json'))
          assert d['status']=='PASS_NOT_REAL_WORK', d
          assert d['route_selected_executor']=='work', d
          assert d['work_required'] is True, d
          assert d['budget_slot']==1, d
          assert d['restart_recovered_same_slot'] is True, d
          assert d['reauth_action_ref']=='auth://vercel/reauthenticate', d
          assert d['provider_observation_simulated'] is True, d
          assert d['real_work_launched'] is False, d
          assert d['authority_created'] is False, d
          assert d['pre_platform_execution_triggered'] is False, d
          assert d['terminal_disposition']=='CONTROL_PLANE_PASS__REAL_WORK_PLATFORM_ACTIVATION_CAPABILITY_EXTERNAL_GATE', d
          PY

      - name: Full General Execution regression
        run: python -m pytest -q

      - name: Audit authority and execution boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          module=Path('src/general_execution/work_escalation_bridge.py').read_text()
          required=[
              'WorkInvocationAuthority',
              'max_invocations',
              'durable Work invocation budget exhausted',
              'execution_triggered: bool = False',
              'authority_created: bool = False',
              'external Work adapter',
              'HUMAN_REAUTH_REQUIRED',
              'auth://',
              'SqliteWorkEscalationStore',
              'ExternalWorkExecutorActivationAdapter',
          ]
          for item in required:
              assert item in module, item
          docs=Path('docs/work-escalation-bridge.md').read_text()
          assert 'PLATFORM_ACTIVATION_CAPABILITY_GATE' in docs
          assert 'The bridge does not itself call or emulate ChatGPT Work.' in docs
          PY

      - name: Upload Work escalation rehearsal report
        uses: actions/upload-artifact@v4
        with:
          name: work-escalation-bridge-rehearsal
          path: /tmp/work-escalation-rehearsal/report.json
          if-no-files-found: error
