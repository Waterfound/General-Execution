name: Unattended pilot preflight

on:
  push:
    branches:
      - main
      - feature/durable-main-canonicalization-20260927
    paths:
      - scripts/run_unattended_pilot.py
      - src/general_execution/portfolio_persistence.py
      - src/general_execution/external_trigger.py
      - tests/test_portfolio_persistence.py
      - tests/test_wave8_adapters.py
      - tests/test_unattended_pilot_preflight.py
      - .github/workflows/unattended-pilot-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Runtime
        run: |
          python - <<'PY'
          import sys, sqlite3
          print(sys.version)
          print(sqlite3.sqlite_version)
          PY
      - name: Install
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Focused pilot preflight tests
        run: python -m pytest tests/test_unattended_pilot_preflight.py -q
      - name: Direct process-separated pilot preflight
        run: |
          python scripts/run_unattended_pilot.py --output /tmp/unattended-pilot-preflight
          cat /tmp/unattended-pilot-preflight/pilot-preflight-report.json
      - name: Full regression
        run: python -m pytest -q
