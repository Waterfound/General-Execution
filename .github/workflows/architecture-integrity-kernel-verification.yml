name: Architecture integrity kernel verification

on:
  push:
    branches:
      - feature/architecture-integrity-kernel-001
    paths:
      - "src/general_execution/architecture_integrity.py"
      - "tests/test_architecture_integrity.py"
      - ".github/workflows/architecture-integrity-kernel-verification.yml"
  pull_request:
    paths:
      - "src/general_execution/architecture_integrity.py"
      - "tests/test_architecture_integrity.py"
      - ".github/workflows/architecture-integrity-kernel-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install candidate
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Focused architecture integrity verification
        run: python -m pytest -q tests/test_architecture_integrity.py
      - name: Execution Protocol regression
        run: python -m pytest -q tests/test_execution_protocol.py
      - name: Full General Execution regression
        run: python -m pytest -q
