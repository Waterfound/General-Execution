name: Runtime repin candidate verification

on:
  push:
    branches:
      - runtime/provider-portability-repin-001
    paths:
      - ".github/workflows/durable-runtime-control.yml"
      - ".github/workflows/persistent-runtime-verification.yml"
      - ".github/workflows/runtime-repin-candidate-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and compile
        run: |
          python -m pip install -e '.[dev]' --disable-pip-version-check
          python -m compileall -q src scripts
      - name: Verify exact repin and authority envelope
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime=Path(".github/workflows/durable-runtime-control.yml").read_text()
          verify=Path(".github/workflows/persistent-runtime-verification.yml").read_text()
          new="8cbe6e034789b0c354977095b75f395a7f1f05a7"
          old="a27a558d4ed0e28d96c3fec408212353d0077060"
          assert runtime.count(new) >= 2
          assert old not in runtime
          assert new in verify
          assert old not in verify
          required=[
              "runtime/durable-asp-control",
              '"events/*.json"',
              "contents: write",
              'test "$GITHUB_ACTOR" = "Waterfound"',
              "cancel-in-progress: false",
              "persistent_provider_trigger_enabled",
              "authority_created",
          ]
          for item in required:
              assert item in runtime, item
          assert '"authority/*.json"' not in runtime
          assert "branches:\n      - main" not in runtime
          lowered=runtime.lower()
          assert "production" not in lowered
          assert "release" not in lowered
          print("RUNTIME_REPIN_AUTHORITY_ENVELOPE_PASS")
          PY
      - name: Focused persistent and portability contracts
        run: |
          python -m pytest             tests/test_persistent_runtime.py             tests/test_provider_portability.py             tests/test_abundant_resource.py -q
      - name: Full regression
        run: python -m pytest -q
      - name: Reconstruct current durable state read-only with new main code
        run: |
          git fetch origin runtime/durable-asp-control
          git show origin/runtime/durable-asp-control:runtime/state.sqlite.b64 | base64 --decode > /tmp/runtime.db
          git show origin/runtime/durable-asp-control:runtime/manifest.json > /tmp/runtime-manifest.json
          python - <<'PY'
          import json
          from general_execution.portfolio_persistence import SqlitePortfolioHeadStore, recover_portfolio_after_restart
          manifest=json.load(open("/tmp/runtime-manifest.json"))
          assert manifest["runtime_source_revision"]=="a27a558d4ed0e28d96c3fec408212353d0077060"
          store=SqlitePortfolioHeadStore("/tmp/runtime.db")
          state, checkpoint, _ = recover_portfolio_after_restart(store,"provider-portability-002")
          assert state.active.state=="human_gate"
          assert state.active.next_action_ref=="authority://provider-portability/runtime-repin"
          assert state.generation==0
          assert state.active.source_revision=="8cbe6e034789b0c354977095b75f395a7f1f05a7"
          assert checkpoint is None
          print("PRE_REPIN_STATE_RECONSTRUCTION_PASS",state.digest)
          PY
