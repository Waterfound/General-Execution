name: FAE Wallet UX WTX03 independent verifier

on:
  push:
    branches:
      - feature/durable-asp-portfolio-state
    paths:
      - .github/workflows/fae-wallet-tx-ux-wtx03-independent-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FAE_BASE: 2b19764abdfc400276f22c235cfa0ae2a6963209
  FAE_CANDIDATE: 2c4e3cf0ed958d1ab28d7bbcaaf01c9424fc1e1d

jobs:
  project-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Waterfound/FAE-testnet
          ref: 2c4e3cf0ed958d1ab28d7bbcaaf01c9424fc1e1d
          fetch-depth: 1
          path: fae
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify immutable WTX03 delta
        working-directory: fae
        run: |
          test "$(git rev-parse HEAD)" = "$FAE_CANDIDATE"
          git fetch --depth=1 origin "$FAE_BASE"
          python - <<'PY'
          import os, subprocess
          expected={
            "core.js",
            "index.html",
            "tests/client-smoke.mjs",
            "wallet.js",
          }
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",os.environ["FAE_BASE"],os.environ["FAE_CANDIDATE"]],
              text=True,
          ).splitlines())
          assert changed==expected,(sorted(changed),sorted(expected))
          assert "wallet-crypto.js" not in changed
          assert "wallet-transactions.js" not in changed
          assert not any(path.startswith(("supabase/","sovereign-forge/")) for path in changed)
          PY

      - name: Verify browser source syntax
        working-directory: fae
        run: |
          node --check core.js
          node --check wallet.js
          node --check wallet-transactions.js
          node --check wallet-crypto.js
          node --check mining.js
          node --check network-status.js

      - name: Verify Wallet UX contracts and acceptance
        working-directory: fae
        run: |
          node tests/wallet-transactions-contract.mjs
          node tests/wallet-transactions-acceptance.mjs

      - name: Verify WTX03 product behavior
        working-directory: fae
        run: |
          node tests/crypto-compat.mjs
          node tests/client-smoke.mjs

      - name: Regress independent node
        working-directory: fae
        run: |
          npm ci --prefix sovereign-forge/node
          npm run --prefix sovereign-forge/node check
          node sovereign-forge/tests/smoke-independent-node.mjs
