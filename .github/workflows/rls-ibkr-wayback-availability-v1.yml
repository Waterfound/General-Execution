name: RLS IBKR Wayback Availability V1

on:
  push:
    branches:
      - build-colony/rls-ibkr-archive-recovery-v1
    paths:
      - rls_ibkr_wayback_availability_v1.py
      - .github/workflows/rls-ibkr-wayback-availability-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-wayback-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Record exact revision
        run: |
          git rev-parse HEAD
          python3 --version
      - name: Execute metadata-only Wayback Availability fallback
        run: python3 rls_ibkr_wayback_availability_v1.py
      - name: Verify frozen invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('workloads/artifacts/rls_ibkr_wayback_availability_v1.json').read_text())
          assert d['authority']=='OBSERVATION_ONLY_NO_RLS_ADMISSION_AUTHORITY'
          assert d['selection']=='FIXED_TARGETS_AND_PUBLICATION_DATES_PREDECLARED'
          assert len(d['results'])==3
          assert d['credential_policy']['user_specific_credentials_used'] is False
          assert d['credential_policy']['api_key_used'] is False
          assert d['credential_policy']['account_login_used'] is False
          assert d['archive_snapshot_bytes_opened'] is False
          assert d['historical_dataset_bytes_opened'] is False
          assert d['economic_values_opened'] is False
          assert d['admission_authority_granted'] is False
          print('evidence_digest_sha256=',d['evidence_digest_sha256'])
          for r in d['results']:
              print(r['id'],r['endpoint_http_status'],r['available'],r['closest'],r['error'])
          PY
      - name: Upload evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: rls-ibkr-wayback-availability-v1
          path: workloads/artifacts/rls_ibkr_wayback_availability_v1.json
          retention-days: 30
