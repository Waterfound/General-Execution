name: Workstream result handoff verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/general_execution/workstream_result_handoff.py"
      - "scripts/run_workstream_result_handoff.py"
      - "provider-result-watches/**"
      - "provider-contracts/fae-a3-r4-control-repair-r1-replay.json"
      - "tests/test_workstream_result_handoff.py"
      - "tests/fixtures/fae_a3_r4_control_repair_r1_provider_result.json"
      - ".github/workflows/durable-workstream-result-reconciliation.yml"
      - ".github/workflows/workstream-result-handoff-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and compile
        run: |
          python -m pip install -e '.[dev]' --disable-pip-version-check
          python -m compileall -q src scripts

      - name: Focused replay and adversarial bank
        run: python -m pytest tests/test_workstream_result_handoff.py -q

      - name: Full regression
        run: python -m pytest -q

      - name: Audit reconciliation envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          workflow=Path(".github/workflows/durable-workstream-result-reconciliation.yml").read_text()
          replay=json.loads(Path("provider-result-watches/fae-a3-r4-control-repair-r1-replay.json").read_text())
          required=[
              'cron: "41 * * * *"',
              "runtime/durable-asp-control",
              "a27a558d4ed0e28d96c3fec408212353d0077060",
              "group: durable-asp-persistent-runtime",
              "cancel-in-progress: false",
              "runtime/workstream-result-handoff/processed",
              "git push origin",
              "authority_created",
          ]
          for item in required:
              assert item in workflow, item
          assert replay["enabled"] is False
          assert replay["outcomes"][0]["transition_class"]=="NEXT_FRONTIER_DISPATCHED"
          assert replay["outcomes"][0]["authority_requirement"]=="existing"
          assert "afi-" not in workflow.lower()
          assert "f2" not in workflow.lower()
          PY

      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/durable-workstream-result-reconciliation.yml")'
