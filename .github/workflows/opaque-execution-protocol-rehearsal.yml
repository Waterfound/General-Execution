name: Opaque Execution Protocol rehearsal

on:
  push:
    branches:
      - feature/architecture-integrity-kernel-001
    paths:
      - "tools/run_opaque_execution_protocol_case.py"
      - "src/general_execution/execution_protocol.py"
      - ".github/workflows/opaque-execution-protocol-rehearsal.yml"
  pull_request:
    paths:
      - "tools/run_opaque_execution_protocol_case.py"
      - "src/general_execution/execution_protocol.py"
      - ".github/workflows/opaque-execution-protocol-rehearsal.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install candidate
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Execute opaque Execution Protocol decision
        run: python tools/run_opaque_execution_protocol_case.py
      - name: Execution Protocol regression
        run: python -m pytest -q tests/test_execution_protocol.py
