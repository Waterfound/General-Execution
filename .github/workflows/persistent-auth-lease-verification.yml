name: Persistent auth lease verification

on:
  push:
    branches:
      - build-colony/persistent-auth-lease-001
    paths:
      - src/general_execution/persistent_auth_lease.py
      - tests/test_persistent_auth_lease.py
      - scripts/run_persistent_auth_lease_rehearsal.py
      - docs/persistent-auth-lease.md
      - .github/workflows/persistent-auth-lease-verification.yml
  pull_request:
    paths:
      - src/general_execution/persistent_auth_lease.py
      - tests/test_persistent_auth_lease.py
      - scripts/run_persistent_auth_lease_rehearsal.py
      - docs/persistent-auth-lease.md
      - .github/workflows/persistent-auth-lease-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and compile
        run: |
          python -m pip install -e '.[dev]' --disable-pip-version-check
          python -m compileall -q src scripts

      - name: Focused persistent-auth adversarial bank
        run: python -m pytest tests/test_persistent_auth_lease.py -q

      - name: Run restart-safe auth lease and provider queue rehearsal
        run: |
          python scripts/run_persistent_auth_lease_rehearsal.py --output /tmp/persistent-auth-rehearsal
          cat /tmp/persistent-auth-rehearsal/report.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/persistent-auth-rehearsal/report.json'))
          assert d['status']=='PASS_NOT_ACTIVATED', d
          assert d['initial_human_gate_queue_depth']==3, d
          assert d['one_login_unlocked_queue_ids']==['q1','q2','q3'], d
          assert d['restart_recovered_queue_ids']==['q2','q3'], d
          assert d['connector_preferred_after_available'] is True, d
          assert d['final_human_gate_queue_depth']==1, d
          assert d['credentials_persisted'] is False, d
          assert d['cookies_persisted'] is False, d
          assert d['tokens_persisted'] is False, d
          assert d['keepalive_attempted'] is False, d
          assert d['provider_expiry_bypassed'] is False, d
          assert d['authority_created'] is False, d
          assert d['execution_triggered'] is False, d
          PY

      - name: Full General Execution regression
        run: python -m pytest -q

      - name: Audit auth and authority boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          module=Path('src/general_execution/persistent_auth_lease.py').read_text()
          docs=Path('docs/persistent-auth-lease.md').read_text()
          required=[
              'AUTH_AVAILABLE',
              'AUTH_SUSPECT',
              'HUMAN_REAUTH_REQUIRED',
              'connector_api',
              'cloud_browser',
              'credentials_persisted: bool = False',
              'cookies_persisted: bool = False',
              'tokens_persisted: bool = False',
              'authority_created: bool = False',
              'execution_triggered: bool = False',
              'probe_before_human_reauthentication',
              'SqliteProviderAuthStateStore',
          ]
          for item in required:
              assert item in module, item
          assert 'There is no keepalive loop' in docs
          assert 'provider rejection/challenge evidence' in docs
          assert 'password, MFA value, cookie, API key, bearer token' in docs
          schema_block=module[module.index('CREATE TABLE IF NOT EXISTS provider_auth_leases'):module.index('CREATE TABLE IF NOT EXISTS provider_auth_queue')]
          lowered=schema_block.lower()
          for forbidden in ('password','cookie','token','api_key','secret','credential'):
              assert forbidden not in lowered, forbidden
          PY

      - name: Upload rehearsal report
        uses: actions/upload-artifact@v4
        with:
          name: persistent-auth-lease-rehearsal
          path: /tmp/persistent-auth-rehearsal/report.json
          if-no-files-found: error
