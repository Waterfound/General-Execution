name: Wave9 verification

on:
  push:
    branches:
      - feature/durable-asp-portfolio-state
    paths:
      - src/general_execution/verification_escalation.py
      - src/general_execution/__init__.py
      - tests/test_wave9_verification_escalation.py
      - .github/workflows/wave9-verification.yml

permissions:
  contents: read

jobs:
  verify-wave9:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Runtime
        run: |
          python - <<'PY'
          import sys, sqlite3
          print(sys.version)
          print(sqlite3.sqlite_version)
          PY
      - name: Install
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Compile
        run: python -m compileall -q src
      - name: Wave9 focused
        run: python -m pytest tests/test_wave9_verification_escalation.py -q
      - name: Full regression
        run: python -m pytest -q
