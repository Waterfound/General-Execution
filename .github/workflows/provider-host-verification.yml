name: Durable provider host verification

on:
  push:
    branches:
      - feature/durable-provider-host-activation-20260928
    paths:
      - src/general_execution/provider_host.py
      - scripts/run_provider_host.py
      - tests/test_provider_host.py
      - .github/provider-watches/**
      - .github/workflows/durable-provider-host.yml
      - .github/workflows/provider-host-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Provider host focused tests
        run: python -m pytest tests/test_provider_host.py -q
      - name: Full regression
        run: python -m pytest -q
      - name: Trusted watch parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from general_execution.provider_host import provider_watch_from_dict
          for path in sorted(Path('.github/provider-watches').glob('*.json')):
              watch=provider_watch_from_dict(json.loads(path.read_text()))
              print(path, watch.digest)
          PY
