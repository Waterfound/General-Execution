name: Human authority bridge verification

on:
  push:
    branches:
      - feature/durable-human-authority-bridge-20260927
    paths:
      - src/general_execution/human_authority.py
      - src/general_execution/asp_transition.py
      - src/general_execution/transition_policy.py
      - scripts/run_human_authority_event.py
      - tests/test_human_authority.py
      - .github/workflows/durable-human-authority.yml
      - .github/workflows/human-authority-bridge-verification.yml

permissions:
  contents: read

jobs:
  verify-human-authority-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e '.[dev]' --disable-pip-version-check
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Human authority focused tests
        run: |
          python -m pytest \
            tests/test_human_authority.py \
            tests/test_transition_policy.py \
            tests/test_asp_transition.py \
            tests/test_persistent_runtime.py -q
      - name: Audit authority workflow envelope
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path(".github/workflows/durable-human-authority.yml").read_text()
          required=[
              "runtime/durable-asp-control",
              '"authority/*.json"',
              "contents: write",
              'test "$GITHUB_ACTOR" = "Waterfound"',
              "durable-asp-persistent-runtime",
              "immutable create-only",
              "credential-shaped",
              "71873e182f5f0d93c35ed35805fe818946bae819",
              "authority_created",
          ]
          for item in required:
              assert item in text, item
          assert '"events/*.json"' not in text
          assert "branches:\n      - main" not in text
          assert "production" not in text.lower()
          assert "release" not in text.lower()
          PY
      - name: Full regression
        run: python -m pytest -q
